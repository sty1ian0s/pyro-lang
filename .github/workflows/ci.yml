name: CI

# Tags only, to save Actions minutes. Check locally in Docker: tools/ci/docker.sh,
# or the real workflow with act:
#   act push -e <(echo '{"ref":"refs/tags/v0"}') -P ubuntu-latest=catthehacker/ubuntu:act-latest
on:
  push:
    tags: ['*']

jobs:
  build:
    # Front end only: no LLVM is installed here, and none may be required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build
      - name: pyro with no arguments prints usage and exits 2
        run: |
          set +e
          out=$(./zig-out/bin/pyro 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          test $rc -eq 2
          grep -q '^usage: pyro' <<<"$out"
      - run: zig build test --summary all
      - run: zig build conformance
